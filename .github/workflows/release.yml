name: Kotlin Master - Release assinada
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Criar keystore temporaria sem imprimir segredos
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Required signing secret missing}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Required signing secret missing}"
          : "${ANDROID_KEY_ALIAS:?Required signing secret missing}"
          : "${ANDROID_KEY_PASSWORD:?Required signing secret missing}"
          echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
          echo "::add-mask::$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/master-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/master-upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Compilar release assinada
        run: ./gradlew --no-daemon validateAppConfig :app:assembleProdRelease :app:bundleProdRelease
      - uses: actions/upload-artifact@v7
        with:
          name: kotlin-master-prod-signed-apk-aab
          path: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/outputs/bundle/prodRelease/*.aab
          if-no-files-found: error
      - name: Remover keystore temporaria
        if: always()
        run: rm -f "$RUNNER_TEMP/master-upload.jks"
